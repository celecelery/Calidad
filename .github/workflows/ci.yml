name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  calidad:
    name: Ruff, pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archivosPython   
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: archivosPython/requirements.txt   

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-django pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Pruebas y cobertura (>= 70%, M-01)
        # DJANGO_SETTINGS_MODULE se toma de pytest.ini / pyproject.toml del proyecto.
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
