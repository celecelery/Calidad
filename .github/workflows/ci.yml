name: CI

on:
    pull_request:
    push:
       branches: [main]

jobs:
  calidad:
    name: Ruff, pruebas y cobertura
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: clave-solo-para-ci-no-es-secreta
      DEBUG: "True"
      DB_HOST: localhost
      DB_NAME: mydatabase
      DB_USER: myuser
      DB_PASSWORD: mypassword
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: archivosPython   
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: archivosPython/requirements.txt   

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-django pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Pruebas y cobertura (>= 70%, M-01)
        # DJANGO_SETTINGS_MODULE se toma de pytest.ini / pyproject.toml del proyecto.
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
